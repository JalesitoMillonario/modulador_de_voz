<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Fondo con gradiente -->
  <rect width="512" height="512" rx="110" fill="url(#grad1)"/>

  <!-- Micrófono -->
  <g transform="translate(256, 256)">
    <!-- Cuerpo del micrófono -->
    <rect x="-45" y="-120" width="90" height="140" rx="45" fill="white" opacity="0.95"/>

    <!-- Líneas del micrófono -->
    <line x1="-25" y1="-90" x2="25" y2="-90" stroke="#667eea" stroke-width="6" stroke-linecap="round"/>
    <line x1="-25" y1="-60" x2="25" y2="-60" stroke="#667eea" stroke-width="6" stroke-linecap="round"/>
    <line x1="-25" y1="-30" x2="25" y2="-30" stroke="#667eea" stroke-width="6" stroke-linecap="round"/>

    <!-- Soporte del micrófono -->
    <path d="M -70 -20 Q -70 60 0 60 Q 70 60 70 -20" stroke="white" stroke-width="12" fill="none" stroke-linecap="round"/>

    <!-- Base -->
    <line x1="0" y1="60" x2="0" y2="100" stroke="white" stroke-width="12" stroke-linecap="round"/>
    <rect x="-50" y="100" width="100" height="12" rx="6" fill="white"/>
  </g>

  <!-- Círculo de grabación (punto rojo) -->
  <circle cx="380" cy="132" r="35" fill="#ff4444"/>
  <circle cx="380" cy="132" r="35" fill="#ff4444" opacity="0.3">
    <animate attributeName="r" from="35" to="50" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" from="0.3" to="0" dur="1s" repeatCount="indefinite"/>
  </circle>
</svg>
